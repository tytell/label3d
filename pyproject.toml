[project]
name = "label3d"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eric Tytell", email = "eric.tytell@tufts.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "sleap-io>=0.6.5",
    "toml>=0.10.2",
]

[project.scripts]
label3d = "label3d:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
