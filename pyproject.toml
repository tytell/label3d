[project]
name = "label3d"
version = "0.1.0"
description = "3D point labeling across multiple synchronized calibrated video streams"
readme = "README.md"
authors = [
    { name = "Eric Tytell", email = "eric.tytell@tufts.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "aniposelib>=0.7.2",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.1",
    "PySide6>=6.9.0",
    "sleap-io>=0.6.5",
    "toml>=0.10.2",
]

[project.scripts]
label3d = "label3d:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
