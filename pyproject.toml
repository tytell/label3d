[project]
name = "label3d"
version = "0.3.0"
description = "3D point labeling across multiple synchronized calibrated video streams"
readme = "README.md"
authors = [
    { name = "Eric Tytell", email = "eric.tytell@tufts.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "aniposelib>=0.7.2",
    "numpy>=2.4.3",
    # The contrib build, not opencv-python-headless: aniposelib requires it and
    # calls the legacy cv2.aruco functions only it has. Two OpenCV wheels share
    # one cv2/ folder, so whichever installed last wins.
    "opencv-contrib-python>=4.13.0.92",
    "pandas>=3.0.1",
    "PySide6>=6.9.0",
    "sleap-io>=0.6.5",
    "toml>=0.10.2",
    "pyqtgraph>=0.13",
    "pyopengl>=3.1.10",
    "pyarrow>=26.0.0",
]

[project.scripts]
label3d = "label3d:main"
label3d-export = "label3d.export_cli:main"
label3d-upgrade = "label3d.upgrade_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
