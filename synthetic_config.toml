# Synthetic test data configuration for label3d
# Units: centimeters for all positions/lengths, degrees for angles

[project]
name = "synthetic_test"
output_dir = "test_project"

[world]
# World coordinate system: x forward, y right, z up
up = [0, 0, 1]

# ── Cameras ──────────────────────────────────────────────────────────────────
# Base camera positions shared across experiments. Each experiment may apply
# small offsets via [experiments.<name>.camera_offsets].
# Each camera is aimed at its target. Focal length is computed so that
# fov_at_target cm are visible horizontally at the camera-to-target distance.
# Square pixels (fx = fy).

[cameras.cam1]
position = [0.0, 40.0, 0.0]       # on the +y axis, 40 cm from origin
target = [0.0, 0.0, 0.0]
up = [0, 0, 1]                    # camera up reference (world z)
resolution = [1280, 1024]          # pixels [width, height]
fov_at_target = 50.0               # cm visible horizontally at the target
distortion = [-0.20, 0.05, 0.0, 0.0, 0.0]  # [k1, k2, p1, p2, k3]

[cameras.cam2]
position = [-50.0, 40.0, 10.0]    # 50 cm back (-x), same y, 10 cm above cam1
target = [0.0, 0.0, 0.0]
up = [0, 0, 1]                    # camera up reference (world z)
resolution = [1280, 1024]
fov_at_target = 50.0
distortion = [-0.18, 0.04, 0.0, 0.0, 0.0]  # [k1, k2, p1, p2, k3]

[cameras.cam3]
position = [0.0, 0.0, -40.0]    # 40 cm below
target = [0.0, 0.0, 0.0]
up = [0, 1, 0]                    # camera up reference (world y, since view is along z)
resolution = [1280, 1024]
fov_at_target = 50.0
distortion = [-0.22, 0.06, 0.0, 0.0, 0.0]  # [k1, k2, p1, p2, k3]


# ── Skeleton ─────────────────────────────────────────────────────────────────
# Offsets are relative to center of mass, in world-frame cm.
# Colors are RGB [0-255].

[skeleton]
edges = [["snout", "left_eye"], ["snout", "dorsal"], ["left_eye", "dorsal"]]

[skeleton.nodes.snout]
offset = [2.5, 0.0, -0.3]
color = [255, 50, 50]

[skeleton.nodes.left_eye]
offset = [0.8, 0.7, 1.0]
color = [50, 255, 50]

[skeleton.nodes.dorsal]
offset = [0.2, 0.0, 2.2]
color = [50, 128, 255]

# ── Experiments ───────────────────────────────────────────────────────────────
# Each experiment has one trial, its own camera position offsets (added to the
# base positions above), and its own motion parameters.

[experiments.exp1]
trial_name = "trial1"
num_frames = 10

[experiments.exp1.camera_offsets]
cam1 = [0.0, 0.0, 0.0]
cam2 = [0.0, 0.0, 0.0]
cam3 = [0.0, 0.0, 0.0]

[experiments.exp1.motion]
start_position = [0.0, 0.0, 0.0]
total_translation = [10.0, 0.0, 2.0]
total_rotation_deg = [0.0, 20.0, 0.0]

[experiments.exp2]
trial_name = "trial1"
num_frames = 10

[experiments.exp2.camera_offsets]
# Cameras shifted slightly relative to exp1 (simulates rig repositioning)
cam1 = [2.0, 0.0, 1.0]
cam2 = [-1.5, 0.5, 0.0]
cam3 = [0.5, 0.0, 1.0]

[experiments.exp2.motion]
start_position = [0.0, 0.0, 0.0]
total_translation = [8.0, 2.0, 1.5]
total_rotation_deg = [5.0, 15.0, 0.0]

# ── Rendering ────────────────────────────────────────────────────────────────

[rendering]
point_radius = 2            # pixels
background_color = [40, 40, 40]   # RGB
codec = "mp4v"
fps = 30
draw_axes = true             # draw world-frame XYZ axes at origin
axes_length = 5.0            # cm

# ── Charuco calibration board ───────────────────────────────────────────────
# Board parameters match aniposelib's CharucoBoard constructor.
# square_length and marker_length are in mm (passed directly to aniposelib;
# converted to cm for 3D placement since the project uses cm throughout).

[charuco]
squares_x = 6               # board squares along X
squares_y = 6               # board squares along Y
square_length = 24.33        # mm — side length of each chessboard square
marker_length = 17.0         # mm — side length of ArUco markers within squares
marker_bits = 5              # ArUco marker bit depth (4, 5, 6, or 7)
dict_size = 50               # ArUco dictionary size (50, 100, 250, 1000)
num_images = 12              # number of board poses to render per camera
board_image_resolution = 2000 # px — resolution of the generated flat board image
background_color = [40, 40, 40]  # RGB background for calibration images

# Board placement region: the board is placed at random poses within this volume
[charuco.placement]
center = [0.0, 0.0, 0.0]    # center of the placement volume (world coords, cm)
extent = [15.0, 15.0, 10.0] # half-extents of the placement volume (cm)
tilt_range_deg = 30.0        # max tilt from facing-camera in any axis (degrees)
seed = 348294                # RNG seed for reproducible board poses
